server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;

    # Ask for UA Client Hints and delegate them to the trace analytics origin so the beacon's
    # cross-origin POST carries them. HTML served by `location /` inherits
    # these; the asset and pdf locations set their own headers and intentionally do not.
    add_header Accept-CH "Sec-CH-UA-Platform-Version, Sec-CH-UA-Arch, Sec-CH-UA-Bitness, Sec-CH-UA-Model, Sec-CH-UA-Full-Version-List, Sec-CH-UA-Form-Factors" always;
    add_header Permissions-Policy "ch-ua-platform-version=(self \"https://trace.tsilenz.io\"), ch-ua-arch=(self \"https://trace.tsilenz.io\"), ch-ua-bitness=(self \"https://trace.tsilenz.io\"), ch-ua-model=(self \"https://trace.tsilenz.io\"), ch-ua-full-version-list=(self \"https://trace.tsilenz.io\"), ch-ua-form-factors=(self \"https://trace.tsilenz.io\")" always;

    # Fingerprinted build assets are safe to cache forever.
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Keep the resume (any PDF) servable but out of search-engine indexes.
    location ~* \.pdf$ {
        add_header X-Robots-Tag "noindex" always;
    }

    # Resolve directory routes like /404-man/, otherwise fall through to error_page.
    location / {
        try_files $uri $uri/ =404;
    }

    # Serve the site's own 404 page, which stock nginx leaves unset.
    error_page 404 /404.html;
}
